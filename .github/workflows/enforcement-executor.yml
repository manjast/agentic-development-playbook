name: enforcement-executor

# The executor runs the drift verifier on a schedule and
# after each push to main (chained after the conformance
# check completes). Default invocation is --no-llm
# (deterministic, no LLM cost). Set ENFORCEMENT_USE_LLM=1
# to opt into the LLM-formatted report path.

on:
  # Chained trigger: run after the eval workflow completes
  # on push to main. The eval workflow is the conformance
  # check (per .github/workflows/eval.yml).
  workflow_run:
    workflows: ["eval"]
    types: [completed]
    branches: [main]
  # Scheduled trigger: weekly on Monday at 09:00 UTC, as a
  # safety net for the workflow_run trigger (covers the case
  # where the eval workflow is disabled or skipped).
  schedule:
    - cron: "0 9 * * 1"
  # Manual trigger: for ad-hoc runs.
  workflow_dispatch:

# Cancel any in-progress run of this workflow on the same
# ref. Prevents runaway executor runs if multiple triggers
# fire close together.
concurrency:
  group: enforcement-executor-${{ github.ref }}
  cancel-in-progress: true

# 5-minute timeout: a verifier run should take 5-10
# seconds. 5 minutes is generous (allows for slow runners
# or a few retries). Default 360 minutes is too long.
timeout-minutes: 5

# Least-privilege permissions. The executor only needs
# to checkout the repo and write the artifact. No
# contents:write (the report is committed to the repo
# by the consumer's workflow, not by this action).
permissions:
  contents: read
  actions: read

jobs:
  executor:
    runs-on: ubuntu-latest
    # Skip the executor if the upstream eval workflow was
    # cancelled (e.g., a fast-follow commit) or failed. We
    # still want the artifact upload to fire (if: always()
    # below), so the upload happens regardless of the
    # executor's exit code.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          # Node.js 24 LTS (v20 is EOL as of 2026-03-24).
          # The verifier's no-LLM path uses `tsx` (Node-only)
          # to run the deterministic algorithm.
          node-version: '24'

      - name: Install tsx
        # The verifier's no-LLM path invokes `tsx
        # verifier-core.ts`. Install tsx globally so the
        # verifier can find it on PATH.
        run: npm install -g tsx

      - name: Run executor
        # The executor script is universal — it works for
        # any agent. It calls the verifier's POSIX sh
        # fallback (scripts/run-verifier.sh, which the
        # verifier's bootstrap installs to that path).
        # Default mode is --no-llm (no LLM cost).
        # Set ENFORCEMENT_USE_LLM=1 to opt into the LLM path.
        env:
          ENFORCEMENT_MODE: ci
          ENFORCEMENT_VERIFIER_SCRIPT: scripts/run-verifier.sh
        run: |
          chmod +x enforcement/executor/run-executor.sh
          ./enforcement/executor/run-executor.sh

      - name: Upload drift report as artifact
        # `if: always()` so the artifact is uploaded even
        # if the executor failed (the report is still
        # useful for debugging). `if-no-files-found: ignore`
        # so an empty/missing report doesn't fail the run.
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: enforcement-drift-report
          path: reports/session-drift.md
          if-no-files-found: ignore
          # 30-day retention: nightly reports accumulate
          # quickly; 30 days is enough for trend analysis.
          retention-days: 30
